# Copie este archivo como config.properties (no se sube a git) y ponga sus valores reales.
# Cada clave tambien se puede definir como variable de entorno: TIENDA_MYSQL_URL, TIENDA_ADMIN_CLAVE_SHA256, ...

# Ruta del archivo de cuenta de servicio de Firebase (nunca lo suba al repositorio)
firebase.credenciales=tienda-electronica.json

mysql.url=jdbc:mysql://localhost:3306/prueba
mysql.usuario=root
mysql.clave=

# Usuarios de la aplicacion. La contrasena se guarda como hash SHA-256 (valor de ejemplo: 12345)
admin.usuario=Admin
admin.clave.sha256=5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5
cliente.usuario=Cliente
cliente.clave.sha256=5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5

# Pasarela Wompi (ambiente Sandbox). Llaves en comercios.wompi.co > Desarrolladores.
# Si se dejan vacias, la tienda usa la pasarela simulada local.
wompi.llave.publica=
wompi.secreto.integridad=
